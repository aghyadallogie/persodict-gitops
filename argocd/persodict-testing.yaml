apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: persodict-testing
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/aghyadallogie/persodict-gitops.git
    targetRevision: main
    path: apps/persodict/chart
    helm:
      valueFiles:
        - testing.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: testing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true